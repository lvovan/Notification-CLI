name: Deploy Notification CLI Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/cli/go.mod

      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Build CLI
        shell: pwsh
        working-directory: apps/cli
        env:
          GOOS: windows
        run: |
          $buildVersion = (Get-Date).ToUniversalTime().ToString("yyyyMMdd.HHmmss")
          New-Item -ItemType Directory -Force -Path ..\..\artifacts | Out-Null
          # Cross-compiled from the same x64 runner; one binary per installer.
          foreach ($architecture in "x64", "arm64") {
            $env:GOARCH = if ($architecture -eq "x64") { "amd64" } else { $architecture }
            go build -trimpath -ldflags "-s -w -X main.version=$buildVersion" -o "..\..\artifacts\notify-$architecture.exe" .
            if ($LASTEXITCODE -ne 0) { throw "go build failed for $architecture" }
          }

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI installers
        shell: pwsh
        run: |
          $msiBuild = [int]$env:GITHUB_RUN_NUMBER % 65535
          $productVersion = "1.0.$msiBuild"
          foreach ($architecture in "x64", "arm64") {
            wix build -arch $architecture `
              -d ProductVersion=$productVersion `
              -d NotifyExecutable="$pwd\artifacts\notify-$architecture.exe" `
              -o "artifacts\NotificationCLI-$architecture.msi" `
              installer\NotificationCLI.wxs
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for $architecture" }
          }
          # The payload is embedded, so a stray cabinet means EmbedCab regressed
          # and the installers would fail wherever they are downloaded alone.
          $stray = Get-ChildItem artifacts -Filter *.cab -ErrorAction SilentlyContinue
          if ($stray) { throw "unexpected external cabinet: $($stray.Name -join ', ')" }

      - name: Upload x64 CLI installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotificationCLI-windows-x64
          path: |
            artifacts/notify-x64.exe
            artifacts/NotificationCLI-x64.msi
          if-no-files-found: error

      - name: Upload ARM64 CLI installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotificationCLI-windows-arm64
          path: |
            artifacts/notify-arm64.exe
            artifacts/NotificationCLI-arm64.msi
          if-no-files-found: error

  build-cli-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/cli/go.mod

      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Build universal CLI
        working-directory: apps/cli
        env:
          GOOS: darwin
        run: |
          set -euo pipefail
          buildVersion=$(date -u +"%Y%m%d.%H%M%S")
          mkdir -p ../../artifacts/pkgroot
          # One universal binary rather than two downloads: lipo joins the
          # Intel and Apple silicon builds into a single executable.
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$buildVersion" \
              -o "../../artifacts/notify-darwin-$arch" .
          done
          lipo -create -output ../../artifacts/pkgroot/notify \
            ../../artifacts/notify-darwin-amd64 ../../artifacts/notify-darwin-arm64
          chmod 755 ../../artifacts/pkgroot/notify
          lipo -info ../../artifacts/pkgroot/notify

      - name: Build installer package
        run: |
          set -euo pipefail
          # /usr/local/bin is already on the default PATH, so the package needs
          # no equivalent of the MSI's PATH entry.
          pkgbuild --root artifacts/pkgroot \
            --identifier dev.lvovan.notificationcli \
            --version "1.0.${GITHUB_RUN_NUMBER}" \
            --install-location /usr/local/bin \
            artifacts/NotificationCLI-macos.pkg

      - name: Upload CLI installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotificationCLI-macos
          path: |
            artifacts/pkgroot/notify
            artifacts/NotificationCLI-macos.pkg
          if-no-files-found: error

  deploy:
    needs:
      - build-cli
      - build-cli-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OpenID Connect token that signs in to Azure.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application
        run: |
          pnpm check
          pnpm test

      - name: Build application
        run: |
          pnpm build
          pnpm package
          pnpm smoke:package

      # Publishing signs in with OpenID Connect rather than a publish profile.
      # A profile is basic authentication over SCM, which this subscription
      # keeps switched off: the site then issues profiles whose credentials are
      # literally "REDACTED", and every upload fails as a bare 401. Federated
      # sign-in needs no stored credential and is unaffected by that setting.
      - name: Check the deployment identity
        env:
          APP_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$APP_NAME" ]; then
            echo "::error::AZURE_APP_SERVICE_NAME is empty. Set it to the App Service site name before deploying."
            exit 1
          fi

          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "::error::AZURE_$name is empty. Publishing signs in with OpenID Connect; see the README for the app registration it needs."
              exit 1
            fi
          done

          echo "Publishing to $APP_NAME."

      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy App Service
        id: publish
        uses: Azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          package: dist/server

      - name: Explain a rejected publish
        if: failure() && steps.publish.outcome == 'failure'
        env:
          APP_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
        run: |
          echo "::error::Publishing to $APP_NAME was rejected. The deployment identity needs the Website Contributor role on the site, and its federated credential must name this repository and branch."
          exit 1
