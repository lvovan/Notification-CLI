name: Provision Notification CLI infrastructure

# Manual runs only. Infrastructure changes are rare and create billable
# resources, so this workflow is never triggered by a push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what-if previews the changes, deploy applies them"
        type: choice
        options:
          - what-if
          - deploy
        default: what-if
      resource_group:
        description: "Resource group. Created automatically in deploy mode."
        type: string
        default: notification-cli
      location:
        description: "Azure region for the resources."
        type: string
        default: francecentral
      name_prefix:
        description: "Prefix for the generated resource names"
        type: string
        default: notification-cli

permissions:
  contents: read
  id-token: write

# Two deployments touching the same resources would race.
concurrency:
  group: notification-cli-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Sign in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only in deploy mode: a preview must not change anything, so what-if
      # requires the group to exist already.
      - name: Ensure resource group
        if: inputs.mode == 'deploy'
        run: |
          az group create \
            --name "${{ inputs.resource_group }}" \
            --location "${{ inputs.location }}" \
            --output none

      - name: Preview changes
        if: inputs.mode == 'what-if'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          RETENTION_DAYS: ${{ vars.NOTIFICATION_CLI_RETENTION_DAYS || '7' }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          az deployment group what-if \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ inputs.name_prefix }}" \
              location="${{ inputs.location }}" \
              vapidPublicKey="$VAPID_PUBLIC_KEY" \
              vapidPrivateKey="$VAPID_PRIVATE_KEY" \
              vapidSubject="$VAPID_SUBJECT" \
              retentionDays="$RETENTION_DAYS" \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraClientId="$ENTRA_CLIENT_ID" \
              entraClientSecret="$ENTRA_CLIENT_SECRET" \
              sessionSecret="$SESSION_SECRET"

      - name: Deploy infrastructure
        id: deploy
        if: inputs.mode == 'deploy'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          RETENTION_DAYS: ${{ vars.NOTIFICATION_CLI_RETENTION_DAYS || '7' }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          outputs=$(az deployment group create \
            --name "notification-cli-${{ github.run_id }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ inputs.name_prefix }}" \
              location="${{ inputs.location }}" \
              vapidPublicKey="$VAPID_PUBLIC_KEY" \
              vapidPrivateKey="$VAPID_PRIVATE_KEY" \
              vapidSubject="$VAPID_SUBJECT" \
              retentionDays="$RETENTION_DAYS" \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraClientId="$ENTRA_CLIENT_ID" \
              entraClientSecret="$ENTRA_CLIENT_SECRET" \
              sessionSecret="$SESSION_SECRET" \
            --query properties.outputs \
            --output json)
          echo "push_configured=$(echo "$outputs" | jq -r .pushConfigured.value)" >> "$GITHUB_OUTPUT"
          echo "app_name=$(echo "$outputs" | jq -r .appServiceName.value)" >> "$GITHUB_OUTPUT"
          echo "app_hostname=$(echo "$outputs" | jq -r .appServiceHostname.value)" >> "$GITHUB_OUTPUT"

      - name: Summarize deployment
        if: inputs.mode == 'deploy'
        env:
          PUSH_CONFIGURED: ${{ steps.deploy.outputs.push_configured }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          APP_HOSTNAME: ${{ steps.deploy.outputs.app_hostname }}
        run: |
          {
            echo "## Infrastructure deployed"
            echo ""
            echo "- Web Push configured: \`$PUSH_CONFIGURED\`"
            echo "- App Service: \`$APP_NAME\` (https://$APP_HOSTNAME)"
            echo ""
            echo "Set the AZURE_APP_SERVICE_NAME variable to \`$APP_NAME\` and store its publish profile as AZURE_APP_SERVICE_PUBLISH_PROFILE."
          } >> "$GITHUB_STEP_SUMMARY"
