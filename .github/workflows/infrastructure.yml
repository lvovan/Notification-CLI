name: Provision Notification CLI infrastructure

# Manual runs only. Infrastructure changes are rare and create billable
# resources, so this workflow is never triggered by a push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what-if previews the changes, deploy applies them"
        type: choice
        options:
          - what-if
          - deploy
        default: what-if
      location:
        description: "Azure region. Only used when creating resources; existing ones keep their region."
        type: string
        default: francecentral
      first_deployment:
        description: "Tick only when the App Service site does not exist yet."
        type: boolean
        default: false
      authorize_deploy:
        description: "Give the deploy workflow's identity what it needs to publish to the site."
        type: boolean
        default: true
      resource_group:
        description: "Resource group. Defaults to the AZURE_RESOURCE_GROUP variable, then to the site name with -wa replaced by -rg."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

# Two deployments touching the same resources would race.
concurrency:
  group: notification-cli-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      # Every resource name derives from the App Service name, which the deploy
      # workflow already relies on. One variable, one source of truth: a second
      # name input could drift from it and provision a parallel, empty copy of
      # the whole stack.
      APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # Checked before signing in so the run fails on the real cause rather
      # than on a confusing authentication error further down.
      - name: Check configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP_INPUT: ${{ inputs.resource_group }}
          RESOURCE_GROUP_VARIABLE: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          missing=""
          [ -n "$AZURE_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$AZURE_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "These identify a federated Entra application allowed to deploy into the subscription." >&2
            echo "Without them, run the deployment locally instead. See README, Provision Azure resources." >&2
            exit 1
          fi

          if [ -z "$APP_SERVICE_NAME" ]; then
            echo "The AZURE_APP_SERVICE_NAME repository variable is not set." >&2
            exit 1
          fi
          case "$APP_SERVICE_NAME" in
            *-wa) ;;
            *)
              echo "AZURE_APP_SERVICE_NAME is '$APP_SERVICE_NAME' but must end in '-wa'," >&2
              echo "because every other resource name is derived from the part before it." >&2
              exit 1
              ;;
          esac

          prefix="${APP_SERVICE_NAME%-wa}"
          echo "NAME_PREFIX=$prefix" >> "$GITHUB_ENV"

          # Resource names must derive from the site name, because a name that
          # resolves to nothing silently builds a parallel stack. The resource
          # group is different: it only says where to look, so it is an input
          # with a derived default rather than a rule. The repository variable
          # sits between the two, so a group that does not follow the naming
          # convention need not be retyped on every run.
          echo "RESOURCE_GROUP=${RESOURCE_GROUP_INPUT:-${RESOURCE_GROUP_VARIABLE:-$prefix-rg}}" >> "$GITHUB_ENV"

      - name: Sign in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only in deploy mode: a preview must not change anything, so what-if
      # requires the group to exist already.
      - name: Ensure resource group
        if: inputs.mode == 'deploy'
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "${{ inputs.location }}" \
            --output none

      # Application settings are not stored as CI secrets. The template reads
      # whatever the running site already has and keeps it, so a re-run needs
      # no credentials at all. Only genuinely absent values are generated here,
      # which is what makes a first deployment self-contained without making
      # every later run a chance to overwrite a working configuration.
      #
      # Structural parameters are the exception: unlike settings, they are not
      # read back off the site, so one left unset reverts to the template
      # default. privateStorageAccess is passed on every run for that reason —
      # omitting it would quietly delete the private endpoint the site reaches
      # storage through, and every request would start failing.
      - name: Build deployment parameters
        env:
          RETENTION_DAYS: ${{ vars.NOTIFICATION_CLI_RETENTION_DAYS || '7' }}
          PRIVATE_STORAGE_ACCESS: ${{ vars.NOTIFICATION_CLI_PRIVATE_STORAGE_ACCESS || 'false' }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          SITE_EXISTS: ${{ inputs.first_deployment && 'false' || 'true' }}
        run: |
          set -euo pipefail

          deployed='{}'
          if [ "$SITE_EXISTS" = "true" ]; then
            if ! raw=$(az webapp config appsettings list \
                  --name "$APP_SERVICE_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --output json 2>/dev/null); then
              echo "Site '$APP_SERVICE_NAME' was not found in '$RESOURCE_GROUP'." >&2
              echo "Tick 'first_deployment' if this stack has never been provisioned." >&2
              exit 1
            fi
            deployed=$(echo "$raw" | jq -c 'map({(.name): .value}) | add // {}')
          fi

          # Only the names are inspected; no value is ever printed or exported.
          # A setting still holding a "TODO:" placeholder counts as absent: the
          # template writes those so the blade lists every value an operator
          # has to fill in, and they are prompts rather than configuration.
          has() {
            [ "$(jq -r --arg k "$1" \
                 '.[$k] // "" | (. != "") and (startswith("TODO:") | not)' \
                 <<<"$deployed")" = "true" ]
          }

          params=$(jq -n \
            --arg prefix "$NAME_PREFIX" \
            --arg location "${{ inputs.location }}" \
            --argjson siteExists "$SITE_EXISTS" \
            --argjson retentionDays "$RETENTION_DAYS" \
            --argjson privateStorageAccess "$PRIVATE_STORAGE_ACCESS" \
            '{namePrefix: {value: $prefix},
              location: {value: $location},
              siteExists: {value: $siteExists},
              retentionDays: {value: $retentionDays},
              privateStorageAccess: {value: $privateStorageAccess}}')

          add() {
            # The value goes through the environment rather than an argument,
            # for the same reason the CLI is given a file: arguments are
            # readable by every other process on the runner.
            params=$(VALUE="$2" jq --arg k "$1" '.[$k] = {value: env.VALUE}' <<<"$params")
          }

          # Passed through on every run so a changed variable takes effect;
          # skipped when unset so it cannot blank what is deployed. Written as
          # full conditionals because `[ -n "$x" ] && add ...` would abort the
          # step under `set -e` whenever the variable is empty.
          if [ -n "$CLARITY_PROJECT_ID" ]; then add clarityProjectId "$CLARITY_PROJECT_ID"; fi
          if [ -n "$ENTRA_TENANT_ID" ]; then add entraTenantId "$ENTRA_TENANT_ID"; fi
          if [ -n "$ENTRA_CLIENT_ID" ]; then add entraClientId "$ENTRA_CLIENT_ID"; fi

          if ! has NOTIFICATION_CLI_SESSION_SECRET; then
            echo "Generating a session signing key."
            add sessionSecret "$(openssl rand -base64 32)"
          fi

          if ! has NOTIFICATION_CLI_VAPID_PRIVATE_KEY; then
            if [ -z "$VAPID_SUBJECT" ]; then
              # A subject is a real contact address that push services use to
              # reach the sender, so it cannot be invented here.
              echo "::warning::Web Push is not configured and the VAPID_SUBJECT variable is unset." \
                   "Set it to mailto:you@example.com and re-run to generate a key pair;" \
                   "until then notifications only reach open browser tabs."
            else
              echo "Generating a VAPID key pair."
              keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
              add vapidPublicKey "$(jq -r .publicKey <<<"$keys")"
              add vapidPrivateKey "$(jq -r .privateKey <<<"$keys")"
              add vapidSubject "$VAPID_SUBJECT"
            fi
          fi

          # Piped rather than passed as an argument, so no generated secret
          # reaches the process table on its way into the file.
          file="$RUNNER_TEMP/parameters.json"
          install -m 600 /dev/null "$file"
          jq '{"$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
               contentVersion: "1.0.0.0",
               parameters: .}' <<<"$params" > "$file"
          echo "PARAMETERS_FILE=$file" >> "$GITHUB_ENV"

          echo "Parameters supplied: $(jq -r 'keys | join(", ")' <<<"$params")"

      - name: Preview changes
        if: inputs.mode == 'what-if'
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "@$PARAMETERS_FILE"

      - name: Deploy infrastructure
        id: deploy
        if: inputs.mode == 'deploy'
        run: |
          outputs=$(az deployment group create \
            --name "notification-cli-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "@$PARAMETERS_FILE" \
            --query properties.outputs \
            --output json)
          echo "push_configured=$(echo "$outputs" | jq -r .pushConfigured.value)" >> "$GITHUB_OUTPUT"
          echo "telemetry_configured=$(echo "$outputs" | jq -r .telemetryConfigured.value)" >> "$GITHUB_OUTPUT"
          echo "app_name=$(echo "$outputs" | jq -r .appServiceName.value)" >> "$GITHUB_OUTPUT"
          echo "app_hostname=$(echo "$outputs" | jq -r .appServiceHostname.value)" >> "$GITHUB_OUTPUT"
          echo "principal_id=$(echo "$outputs" | jq -r .appServicePrincipalId.value)" >> "$GITHUB_OUTPUT"
          echo "managed_identity_refused=$(echo "$outputs" | jq -r .entraManagedIdentityRefused.value)" >> "$GITHUB_OUTPUT"
          echo "stale_settings=$(echo "$outputs" | jq -c '.staleSettings.value // []')" >> "$GITHUB_OUTPUT"

      # Publishing signs in with OpenID Connect and reaches the site through
      # Azure Resource Manager, so the deploy workflow needs two things that
      # provisioning cannot create in Bicep: a federated credential Entra will
      # accept, and a role assignment on the site. Both are done here so a
      # freshly provisioned stack is publishable without a manual step.
      #
      # This is the same identity that just provisioned, so it is granted only
      # the narrow role that publishing itself requires; the broader rights it
      # used above come from the resource group.
      - name: Authorize the deploy workflow
        if: inputs.mode == 'deploy' && inputs.authorize_deploy
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail

          site_id=$(az webapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)

          if ! sp_id=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id --output tsv 2>/dev/null); then
            echo "::error::Cannot resolve the service principal for this identity, so publishing cannot be authorized. Grant it directory read access, or assign Website Contributor on $APP_NAME by hand."
            exit 1
          fi

          # Re-running must not fail, and az errors on a duplicate assignment.
          existing=$(az role assignment list \
            --assignee "$sp_id" --scope "$site_id" \
            --query "[?roleDefinitionName=='Website Contributor'] | length(@)" \
            --output tsv)
          if [ "$existing" = "0" ]; then
            az role assignment create \
              --assignee-object-id "$sp_id" \
              --assignee-principal-type ServicePrincipal \
              --role "Website Contributor" \
              --scope "$site_id" \
              --output none
            echo "Granted Website Contributor on $APP_NAME."
          else
            echo "Website Contributor on $APP_NAME is already granted."
          fi

          # GitHub presents one of two subject forms and nothing says which in
          # advance: the plain one, or an immutable one naming the owner and
          # repository by numeric ID. A credential that does not match is
          # rejected at sign-in with AADSTS700213, before Azure is reached at
          # all, so both are registered.
          ref="ref:refs/heads/$DEFAULT_BRANCH"
          repo_name="${REPOSITORY#*/}"
          subjects=$(printf '%s\n%s\n' \
            "repo:$REPOSITORY:$ref" \
            "repo:$OWNER@$OWNER_ID/$repo_name@$REPOSITORY_ID:$ref")

          # Reading the app registration needs Microsoft Graph permission the
          # deploying identity may simply not have, and az fails rather than
          # returning nothing. Federated credentials are a one-time bootstrap,
          # so this warns and moves on instead of failing a good deployment.
          app_object_id=$(az ad app list \
            --filter "appId eq '$AZURE_CLIENT_ID'" --query "[0].id" --output tsv 2>/dev/null) || true
          if [ -z "$app_object_id" ] || [ "$app_object_id" = "null" ]; then
            echo "::warning::Cannot read the app registration for this identity, so its federated credentials were left alone. Register them by hand; see README, Hosting. The subjects needed are:"
            echo "$subjects" | while read -r subject; do echo "::warning::  $subject"; done
            exit 0
          fi

          registered=$(az ad app federated-credential list \
            --id "$app_object_id" --query "[].subject" --output json 2>/dev/null) || registered='[]'

          index=0
          echo "$subjects" | while read -r subject; do
            index=$((index + 1))
            if echo "$registered" | jq -e --arg s "$subject" 'index($s)' > /dev/null; then
              echo "Federated credential already present for $subject."
              continue
            fi
            body=$(jq -n --arg s "$subject" --arg n "github-$DEFAULT_BRANCH-$index" \
              '{name: $n,
                issuer: "https://token.actions.githubusercontent.com",
                subject: $s,
                audiences: ["api://AzureADTokenExchange"]}')
            file="$RUNNER_TEMP/fic-$index.json"
            install -m 600 /dev/null "$file"
            printf '%s' "$body" > "$file"
            if az ad app federated-credential create \
                 --id "$app_object_id" --parameters "@$file" --output none 2>/dev/null; then
              echo "Registered federated credential for $subject."
            else
              echo "::warning::Could not register a federated credential for $subject. The deploy workflow will fail with AADSTS700213 until it exists."
            fi
            rm -f "$file"
          done

      - name: Summarize deployment
        if: inputs.mode == 'deploy'
        env:
          PUSH_CONFIGURED: ${{ steps.deploy.outputs.push_configured }}
          TELEMETRY_CONFIGURED: ${{ steps.deploy.outputs.telemetry_configured }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
          APP_HOSTNAME: ${{ steps.deploy.outputs.app_hostname }}
          PRINCIPAL_ID: ${{ steps.deploy.outputs.principal_id }}
          MANAGED_IDENTITY_REFUSED: ${{ steps.deploy.outputs.managed_identity_refused }}
          STALE_SETTINGS: ${{ steps.deploy.outputs.stale_settings }}
          AUTHORIZED: ${{ inputs.authorize_deploy }}
        run: |
          {
            echo "## Infrastructure deployed"
            echo ""
            echo "- App Service: \`$APP_NAME\` (https://$APP_HOSTNAME)"
            echo "- Web Push configured: \`$PUSH_CONFIGURED\`"
            echo "- Analytics configured: \`$TELEMETRY_CONFIGURED\`"
            echo "- Managed identity object ID: \`$PRINCIPAL_ID\`"
            echo ""

            if [ "$AUTHORIZED" = "true" ]; then
              echo "The deploy workflow is authorized to publish to this site. Set the AZURE_APP_SERVICE_NAME variable to \`$APP_NAME\` if it is not already."
            else
              echo "Set the AZURE_APP_SERVICE_NAME variable to \`$APP_NAME\`, then re-run with \`authorize_deploy\` ticked so the deploy workflow can publish to it."
            fi
            echo ""

            if [ "$MANAGED_IDENTITY_REFUSED" = "true" ]; then
              echo "> [!WARNING]"
              echo "> Managed-identity sign-in was requested but refused, because the Entra application is in a different tenant from the site identity. Entra would reject every sign-in with AADSTS70025, so the site was configured as a public client instead. Clear NOTIFICATION_CLI_ENTRA_USE_MANAGED_IDENTITY to stop asking."
              echo ""
            fi

            if [ -n "$STALE_SETTINGS" ] && [ "$STALE_SETTINGS" != "[]" ]; then
              echo "> [!NOTE]"
              echo "> Retired settings are still on the site and must be deleted by hand: \`$STALE_SETTINGS\`."
              echo ""
            fi

            echo "On a first deployment, add \`https://$APP_HOSTNAME/auth/callback\` as a redirect URI on the Entra application."
          } >> "$GITHUB_STEP_SUMMARY"
